name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-space-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -- --webpack
      - name: Package static Space
        run: |
          mkdir "$RUNNER_TEMP/sonder-space"
          cp -R out/. "$RUNNER_TEMP/sonder-space/"
          cp CREDITS.md "$RUNNER_TEMP/sonder-space/CREDITS.md"
          cat > "$RUNNER_TEMP/sonder-space/README.md" <<'EOF'
          ---
          title: Sonder
          emoji: 🎧
          colorFrom: green
          colorTo: gray
          sdk: static
          app_file: index.html
          fullWidth: true
          short_description: Explore 40 CC songs through a branching music map.
          ---

          Built from [`t3-sketch/graph-rec`](https://github.com/t3-sketch/graph-rec). Track and metadata attribution is available in [`CREDITS.md`](./CREDITS.md).
          EOF
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/sonder-space/index.html"
          test -f "$RUNNER_TEMP/sonder-space/CREDITS.md"
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check huggingface_hub==1.31.0
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo 'Missing HF_TOKEN repository secret'; exit 1; }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo 'Skipped stale deployment'; exit 0; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = api.space_info("t3-sketch/sonder")
          assert space.sdk == "static" and space.private is False, "Expected the approved Public Static Space"
          api.upload_folder(
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "sonder-space"),
              repo_id="t3-sketch/sonder",
              repo_type="space",
              delete_patterns="*",
              commit_message=f"Deploy GitHub commit {os.environ['GITHUB_SHA']}",
          )
          PY
